<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parks I've Wandered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
  :root {
    --paper: #f2e8d2;
    --paper-dark: #e6d8b8;
    --ink: #3b3226;
    --ink-soft: #7a6a55;
    --forest: #2f4a35;
    --orange: #e8692e;
    --orange-dark: #a8461a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e1210;
    color: #eef1ec;
    font-family: "Inter", system-ui, sans-serif; font-size: 14px;
    height: 100vh; overflow: hidden;
    display: grid; grid-template-rows: 1fr;
  }

  main { display: grid; grid-template-columns: 1fr; min-height: 0; }
  .mapwrap { position: relative; min-height: 0; }
  #map { position: absolute; inset: 0; }

  /* overlay UI: dark frosted glass so the imagery stays the hero */
  .card { background: rgba(14,18,16,.62); backdrop-filter: blur(12px) saturate(1.3); -webkit-backdrop-filter: blur(12px) saturate(1.3);
          border: 1px solid rgba(255,255,255,.12); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.35); color: #eef1ec; }
  .legend { position: absolute; left: 16px; top: 16px; z-index: 2; display: flex; gap: 18px; padding: 9px 14px;
            font: 500 12px/1 "Inter", system-ui, sans-serif; letter-spacing: .01em; }
  .legend span { display: flex; align-items: center; gap: 7px; opacity: .92; }
  .regions { position: absolute; left: 16px; bottom: 32px; z-index: 2; display: flex; gap: 4px; padding: 4px; }
  .regions button, .toggle3d {
    font: 600 12px/1 "Inter", system-ui, sans-serif; letter-spacing: .02em;
    background: transparent; border: 0; color: #dfe5dc; border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: background .15s;
  }
  .regions button:hover { background: rgba(255,255,255,.1); }
  .toggle3d.on { background: #ff7a35; color: #1b0e06; }

  /* park name tags (selected trip / hover) */
  .tag { font: 600 12.5px/1 "Inter", system-ui, sans-serif; color: #fff; white-space: nowrap; pointer-events: none;
         padding: 10px 18px 10px 12px; display: flex; align-items: center; gap: 8px; letter-spacing: .01em;
         background: radial-gradient(closest-side, rgba(6,10,8,.55), rgba(6,10,8,.25) 60%, transparent);
         text-shadow: 0 1px 2px rgba(0,0,0,.85), 0 0 12px rgba(0,0,0,.5); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #ff7a35); box-shadow: 0 0 8px var(--c, #ff7a35); }

  .maplibregl-ctrl-group { background: rgba(14,18,16,.62) !important; border: 1px solid rgba(255,255,255,.12); border-radius: 10px !important; box-shadow: 0 8px 28px rgba(0,0,0,.35) !important; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid rgba(255,255,255,.1) !important; }
  .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1) brightness(1.4); }
  .maplibregl-ctrl-attrib { background: rgba(14,18,16,.5) !important; font-size: 10px; }
  .maplibregl-ctrl-attrib a, .maplibregl-ctrl-attrib-inner { color: #cfd6cc !important; }
  .maplibregl-popup-tip { display: none; }
  .maplibregl-popup-content { background: transparent; box-shadow: none; padding: 0; }
  .hover .maplibregl-popup-content { pointer-events: none; }

  /* info card: no box — text sits on the land over a soft haze that fades into the scenery */
  .info .maplibregl-popup-content {
    min-width: 290px; padding: 22px 56px 24px 22px; border: 0; border-radius: 0; box-shadow: none;
    background: transparent; position: relative; isolation: isolate;
    color: #f3f5f0; font: 400 13px/1.45 "Inter", system-ui, sans-serif;
    text-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 16px rgba(0,0,0,.45);
    animation: reveal .55s cubic-bezier(.2,.7,.2,1) both;
  }
  /* the haze: its own blurred layer, larger than the text, so it feathers out on every side */
  .info .maplibregl-popup-content::before {
    content: ""; position: absolute; inset: -34px -60px -34px -46px; z-index: -1; pointer-events: none;
    background: radial-gradient(closest-side, rgba(6,10,8,.62) 0%, rgba(6,10,8,.45) 45%, rgba(6,10,8,.16) 75%, transparent 100%);
    filter: blur(8px);
  }
  .info.maplibregl-popup, .info .maplibregl-popup-content { overflow: visible; }
  @keyframes reveal { from { opacity: 0; transform: translateX(-10px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
  .info .maplibregl-popup-close-button { color: #fff; opacity: .55; font-size: 20px; right: 26px; top: 14px; background: none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .info .maplibregl-popup-close-button:hover { opacity: 1; background: none; }
  .info .eyebrow { font: 600 10.5px/1 "Inter", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--c, #ff9a5c);
                   margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .info .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .info h3 { font: 800 27px/1.05 "Fraunces", serif; margin: 0 0 4px; color: #fff; letter-spacing: .005em; }
  .info .kind { color: rgba(236,240,232,.78); font-size: 12.5px; }
  .info .row { position: relative; margin-top: 14px; padding-top: 12px; }
  .info .row::before { content: ""; position: absolute; top: 0; left: 0; width: 56px; height: 1px;
                       background: linear-gradient(90deg, var(--c, #ff9a5c), transparent); opacity: .9; }
  .info .when { font-weight: 600; color: #fff; font-size: 14px; }
  .info .sub { color: rgba(236,240,232,.72); font-size: 12.5px; }

  /* music button: three little bars that dance while the theme plays */
  .regions .music { display: flex; align-items: center; gap: 8px; }
  .music .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
  .music .eq i { width: 2.5px; height: 5px; background: currentColor; border-radius: 1px; }
  .music .eq i:nth-child(2) { height: 10px; }
  .music .eq i:nth-child(3) { height: 7px; }
  .regions .music.on { color: #ffb27a; }
  .music.on .eq i { animation: eq .9s ease-in-out infinite; }
  .music.on .eq i:nth-child(2) { animation-delay: -.3s; }
  .music.on .eq i:nth-child(3) { animation-delay: -.6s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 12px; } }

  @media (max-width: 820px) { .legend { display: none; } }
</style>
</head>
<body>
<main>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend card">
      <span><svg width="12" height="16" viewBox="0 0 12 16"><path d="M6 0 L11 4 L6 8 L1 4 Z" fill="#ff8a45"/><rect x="5" y="7" width="2" height="8" fill="#e0662a"/></svg>Parks visited</span>
      <span><svg width="14" height="16" viewBox="0 0 14 16"><path d="M7 0 L12 7 H9.5 L13 12 H1 L4.5 7 H2 Z" fill="#3f8d55"/><rect x="6" y="12" width="2" height="4" fill="#6b4523"/></svg>Nature spots</span>
      <span><svg width="12" height="14" viewBox="0 0 12 14"><rect x="1" y="10" width="10" height="4" rx="1.5" fill="#c99d55"/><rect x="2.5" y="6" width="7" height="4" rx="1.5" fill="#e0bd7a"/><rect x="4" y="2" width="4" height="4" rx="1.5" fill="#c99d55"/></svg>Other places</span>
    </div>
    <div class="regions card">
      <button data-r="us">Lower 48</button>
      <button data-r="ak">Alaska</button>
      <button data-r="hi">Hawaiʻi</button>
      <button class="toggle3d on" id="t3d">3D</button>
      <button class="music" id="music" title="Sound on/off (M)" aria-label="Toggle sound" aria-pressed="false"><span class="eq"><i></i><i></i><i></i></span>Sound</button>
    </div>
  </div>
</main>


<script src="/data/trips.js"></script>
<script src="/mockup/music.js"></script>
<script>
// ---------- Data: generated from my Google Maps Timeline by scripts/import-timeline.mjs ----------
const PARKS = window.PARKS;
const parkById = Object.fromEntries(PARKS.map(p => [p.id, p]));
const TRIPS = window.TRIP_DATA.trips;
const EXTRA = window.TRIP_DATA.extraVisits ?? [];      // parks visited before my Timeline started
const OTHER = window.TRIP_DATA.otherPlaces ?? [];      // memorable spots that aren't national parks
const NATURE = window.TRIP_DATA.natureSpots ?? [];     // nature & wilderness spots found in my Timeline
const visitedIds = new Set([...TRIPS.flatMap(t => t.visits.map(v => v.parkId)), ...EXTRA.map(v => v.parkId)]);

// ---------- Helpers ----------
const parseDate = d3.utcParse("%Y-%m-%d");
const fmtLong = d3.utcFormat("%A, %B %-d, %Y");
const fmtShort = d3.utcFormat("%b %-d");
const tripsForPark = id => TRIPS.filter(t => t.visits.some(v => v.parkId === id));

// ---------- 3D pickup items (three.js, drawn as a custom layer on the map) ----------
let selectedParkId = null, modelsOn = true;
const KINDS = {
  park:   { px: 78, hi: 0xffd77a },   // px = on-screen height at country zoom
  nature: { px: 56, hi: 0x8dffb0 },
  other:  { px: 44, hi: 0xffe680 },
};
function items() {
  return [
    ...PARKS.filter(p => visitedIds.has(p.id)).map(p => ({ kind: "park", c: [p.lon, p.lat], props: { kind: "park", ref: p.id, name: p.name, accent: "#ff7a35" } })),
    ...NATURE.map((n, i) => ({ kind: "nature", c: [n.lon, n.lat], props: { kind: "nature", ref: i, name: n.name, accent: "#4fae6a" } })),
    ...OTHER.map((o, i) => ({ kind: "other", c: [o.lon, o.lat], props: { kind: "other", ref: i, name: o.name, accent: "#e3c283" } })),
  ];
}

// low-poly models, 1 unit tall, y up. Every part gets its own material so the glow can sweep part by part.
function part(geo, color, y, rotY = 0) {
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: .55, metalness: .1, emissive: 0x000000 }));
  m.position.y = y; m.rotation.y = rotY; m.userData.base = color;
  return m;
}
// same designs as the earlier map-layer models: stacked flat-topped prisms (1 unit tall, R = footprint radius)
const prismPart = (r, n, y0, y1, color, rotDeg = 0) => part(new THREE.CylinderGeometry(r, r, y1 - y0, n), color, (y0 + y1) / 2, rotDeg * Math.PI / 180);
function buildPark() {            // faceted beacon: dark plinth, slim column, stepped five-layer gem
  const g = new THREE.Group(), R = .17;
  g.add(prismPart(.34 * R, 8, 0, .035, 0x4a2310, 22.5));
  g.add(prismPart(.11 * R, 8, .035, .8, 0xe0662a, 22.5));
  const cap = [0xc9531c, 0xff7b35, 0xff9a52, 0xff7b35, 0xffb27a];
  g.userData.gem = [.28, .62, .78, .58, .26].map((w, i) => {
    const m = prismPart(w * R, 8, .78 + i * .045, .825 + i * .045, cap[i], 22.5);
    g.add(m); return m;
  });
  return g;
}
function buildTree() {            // stepped low-poly pine: trunk + three cones of four hexagonal tiers
  const g = new THREE.Group(), R = .2;
  const greens = [0x24583a, 0x2f6f43, 0x3b8552, 0x4a9a60];
  g.add(prismPart(.13 * R, 6, 0, .2, 0x5a3a1e));
  [[1, .16], [.78, .42], [.55, .66]].forEach(([r0, z0], k) => {
    for (let t = 0; t < 4; t++) {
      const z = z0 + t * .09;
      g.add(prismPart(r0 * R * (1 - t * .22), 6, z, z + .09, greens[(t + k) % 4], k * 30));
    }
  });
  return g;
}
function buildCairn() {           // trail cairn: six stacked, slightly twisted sandstone blocks
  const g = new THREE.Group(), R = .23;
  const sand = [0xb88a45, 0xd6b06b, 0xc99d55, 0xe3c283, 0xc4964e, 0xecd29b];
  [1, .84, .9, .68, .6, .42].forEach((w, i) => g.add(prismPart(w * R, 4, i / 6, (i + 1) / 6, sand[i], 45 + i * 17)));
  return g;
}
// widen the footprints so the proportions match the earlier chunky map-layer look
const WIDTH = { park: 1.45, nature: 1.7, other: 1.6 };
const BUILD = Object.fromEntries(Object.entries({ park: buildPark, nature: buildTree, other: buildCairn })
  .map(([k, fn]) => [k, () => { const outer = new THREE.Group(), g = fn(); g.scale.set(WIDTH[k], 1, WIDTH[k]); outer.add(g); outer.userData = g.userData; return outer; }]));

const pickups = [];               // { item, group, scene, height px, ground screen point }
const t0 = performance.now() + 500;
const pickupLayer = {
  id: "pickups-3d", type: "custom", renderingMode: "3d",
  onAdd(map, gl) {
    this.camera = new THREE.Camera();
    this.renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
    for (const it of items()) {
      const scene = new THREE.Scene(), group = BUILD[it.kind]();
      scene.add(new THREE.AmbientLight(0xffffff, .5));
      const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(.6, 1, .8); scene.add(sun);
      const rim = new THREE.DirectionalLight(0xbfd8ff, .45); rim.position.set(-.8, .4, -.6); scene.add(rim);
      scene.add(group);
      group.traverse(o => { if (o.isMesh) o.userData.lv = o.position.y; });   // 0 bottom .. 1 top, for the sweep
      pickups.push({ it, scene, group, phase: Math.random() * 6 });
    }
    paintSelection();
  },
  render(gl, matrix) {
    const t = Math.max(0, performance.now() - t0) / 1000;
    const grow = d3.easeBackOut.overshoot(1.4)(Math.min(1, t / 1.4));
    const z = map.getZoom(), proj = new THREE.Matrix4().fromArray(matrix);
    // recurring "pick me up": a band of light sweeps bottom→top every 2.6 s, then the whole item pings
    const ph = (t % 2.6) / 1.1;
    const P = ph <= 1 ? -.2 + ph * 1.4 : -9;
    const flash = ph > 1 && ph < 1.5 ? (1 - (ph - 1) / .5) : 0;
    for (const pk of pickups) {
      const { it, scene, group } = pk;
      const elev = map.queryTerrainElevation(it.c) ?? 0;
      const merc = maplibregl.MercatorCoordinate.fromLngLat(it.c, elev);
      const mpp = 40075016.686 * Math.cos(it.c[1] * Math.PI / 180) / (512 * 2 ** z);       // meters per screen pixel
      const px = KINDS[it.kind].px * Math.min(2.4, 1 + .14 * Math.max(0, z - 3.5)) * grow;
      pk.px = px;
      const s = merc.meterInMercatorCoordinateUnits() * px * mpp;
      // float + spin
      group.position.y = .06 + .05 * Math.sin(t * 2.2 + pk.phase);
      group.rotation.y = t * .9 + pk.phase;
      // glow inside the item: sweep band + soft breathing + top-of-sweep flash
      const breathe = .03 + .03 * Math.sin(t * 2.4 + pk.phase);
      group.traverse(o => {
        if (!o.isMesh) return;
        const sweep = Math.max(0, 1 - Math.abs(o.userData.lv - P) * 3.2);
        const w = Math.max(breathe, sweep, flash * .8);
        o.material.emissive.setHex(KINDS[it.kind].hi);
        o.material.emissiveIntensity = w * 1.1;
      });
      const mvp = proj.clone().multiply(
        new THREE.Matrix4().makeTranslation(merc.x, merc.y, merc.z)
          .scale(new THREE.Vector3(s, -s, s))
          .multiply(new THREE.Matrix4().makeRotationX(Math.PI / 2)));
      this.camera.projectionMatrix = mvp;
      pk.hit = screenBox(mvp, HIT[it.kind]);   // where this item really is on screen, so every part of it is clickable
      this.renderer.resetState();
      this.renderer.render(scene, this.camera);
    }
    map.triggerRepaint();
  },
};
// selected park: the gem turns white-hot
function paintSelection() {
  for (const { it, group } of pickups) {
    if (it.kind !== "park") continue;
    const sel = it.props.ref === selectedParkId;
    group.userData.gem.forEach(m => m.material.color.setHex(sel ? 0xfff6ea : m.userData.base));
  }
}
function refreshModels() { paintSelection(); map.triggerRepaint(); }
// hit-testing: project each model's bounding box through the exact matrix it is drawn with,
// so the clickable area is the whole object (plus a little padding), at any zoom, tilt or rotation
const HIT = { park: { r: .27, h: 1.18 }, nature: { r: .42, h: 1.18 }, other: { r: .44, h: 1.16 } };   // model units, 1 = full height
function screenBox(m, { r, h }) {
  const cv = map.getCanvas(), cw = cv.clientWidth, ch = cv.clientHeight, v = new THREE.Vector4();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, depth = 0;
  for (const x of [-r, r]) for (const y of [0, h]) for (const z of [-r, r]) {
    v.set(x, y, z, 1).applyMatrix4(m);
    if (v.w <= 0) return null;                                       // behind the camera
    const px = (v.x / v.w * .5 + .5) * cw, py = (1 - (v.y / v.w * .5 + .5)) * ch;
    x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); depth += v.w;
  }
  const pad = 10;
  return { x0: x0 - pad, y0: y0 - pad, x1: x1 + pad, y1: y1 + pad, depth: depth / 8 };
}
function pickAt(pt) {
  let best = null;
  for (const pk of pickups) {
    const b = pk.hit;
    if (!b || pt.x < b.x0 || pt.x > b.x1 || pt.y < b.y0 || pt.y > b.y1) continue;
    if (!best || b.depth < best.hit.depth) best = pk;                // overlapping items: the one nearer the camera wins
  }
  return best;
}
// visit dates only — no source notes, no durations
const fmtDate = d => d.length === 7 ? d3.utcFormat("%B %Y")(d3.utcParse("%Y-%m")(d)) : fmtLong(parseDate(d));
const visitRow = ({ date, end }) => `<div class="when">${!date ? "Visited" : end ? `${fmtShort(parseDate(date))} – ${fmtDate(end)}` : fmtDate(date)}</div>`;
function parkVisits(id) {
  const out = [];
  for (const t of TRIPS) for (const v of t.visits) if (v.parkId === id) out.push({ date: v.date, end: v.endDate });
  for (const v of EXTRA) if (v.parkId === id) out.push({ date: v.date });
  return out.sort((a, b) => (b.date ?? "").localeCompare(a.date ?? ""));      // newest first
}
function openModel(p) {
  if (p.kind === "park") return selectPark(p.ref);
  const item = p.kind === "nature" ? NATURE[p.ref] : OTHER[p.ref];
  const dates = (p.kind === "nature" ? [item.date] : item.dates).filter(Boolean).sort().reverse();
  openKey = `${p.kind}:${p.ref}`;
  showPopup([item.lon, item.lat], card(p.kind === "nature" ? "Nature spot" : "Other place", p.accent, item.name, item.kind,
    (dates.length ? dates : [null]).map(d => visitRow({ date: d }))));
  map.flyTo({ center: [item.lon, item.lat], zoom: 12, pitch: 66, bearing: (Math.random() * 120) - 60, duration: 3000, essential: true });
}
const card = (eyebrow, color, title, kind, rows) =>
  `<div style="--c:${color}"><div class="eyebrow"><i></i>${eyebrow}</div><h3>${title}</h3>${kind ? `<div class="kind">${kind}</div>` : ""}${rows.map(r => `<div class="row">${r}</div>`).join("")}</div>`;
const fc = features => ({ type: "FeatureCollection", features });

// ---------- Map: satellite imagery + 3D terrain ----------
const HOME = { center: [-98.5, 38.6], zoom: 3.55, pitch: 40, bearing: -6 };
const map = new maplibregl.Map({
  container: "map",
  ...HOME,
  hash: true,                    // camera lives in the URL (#zoom/lat/lng/bearing/pitch) so views can be shared
  maxPitch: 80,
  attributionControl: false,
  style: {
    version: 8,
    sources: {
      satellite: {
        type: "raster", tileSize: 256, maxzoom: 18,
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        attribution: "Imagery © Esri, Maxar, Earthstar Geographics"
      },
      dem: {
        type: "raster-dem", tileSize: 256, maxzoom: 14, encoding: "terrarium",
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        attribution: "Terrain: Mapzen / AWS Open Data"
      }
    },
    layers: [
      { id: "satellite", type: "raster", source: "satellite",
        paint: { "raster-saturation": 0.12, "raster-contrast": 0.08, "raster-brightness-max": 0.95 } },
      { id: "hillshade", type: "hillshade", source: "dem",
        paint: { "hillshade-exaggeration": 0.35, "hillshade-shadow-color": "#2b2416", "hillshade-highlight-color": "#fff6e0", "hillshade-accent-color": "#3d3a2a" } }
    ],
    terrain: { source: "dem", exaggeration: 1.6 },
    sky: {
      "sky-color": "#7fb3dc", "horizon-color": "#dfe9ee", "fog-color": "#e9e4d6",
      "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.7, "fog-ground-blend": 0.35, "atmosphere-blend": 0.8
    }
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.AttributionControl({ compact: true }), "bottom-right");

map.on("load", async () => {
  // faint state borders on top of the imagery
  try {
    const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json");
    map.addSource("states", { type: "geojson", data: topojson.mesh(us, us.objects.states, (a, b) => a !== b) });
    map.addLayer({ id: "states", type: "line", source: "states",
      paint: { "line-color": "#fff6e0", "line-opacity": ["interpolate", ["linear"], ["zoom"], 3, .45, 8, .15], "line-width": 1, "line-dasharray": [3, 2] } });
  } catch (e) { console.warn("state borders unavailable", e); }

  // ---------- markers ----------
  // 3D pickup items
  map.addLayer(pickupLayer);

  // click + hover: the whole model is the target
  const hover = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 14, className: "hover" });
  const tagHTML = (name, color) => `<div class="tag" style="--c:${color}"><i></i>${name}</div>`;
  map.on("click", e => {
    const pk = modelsOn && pickAt(e.point);
    hover.remove();
    if (pk) { if (window.AdventureMusic) AdventureMusic.sfx(pk.it.kind); openModel(pk.it.props); } else closeInfo();               // clicking empty map closes the card
  });
  map.on("mousemove", e => {
    const pk = modelsOn && pickAt(e.point);
    map.getCanvas().style.cursor = pk ? "pointer" : "";
    if (pk && openKey !== `${pk.it.props.kind}:${pk.it.props.ref}`) hover.setLngLat(pk.it.c).setHTML(tagHTML(pk.it.props.name, pk.it.props.accent)).addTo(map);
    else hover.remove();
  });

  // gentle intro: drift in from higher up
  if (!location.hash) map.easeTo({ ...HOME, pitch: 48, bearing: -12, duration: 4000 });   // skip the intro on a shared view
});

// ---------- Interactions ----------
let openKey = null, reopening = false;
function showPopup(lngLat, html) {
  reopening = true;                                                 // re-opening for another item shouldn't clear the selection
  infoPopup.setLngLat(lngLat).setHTML(html).addTo(map);
  reopening = false;
}
function closeInfo() { infoPopup.remove(); }                        // its 'close' handler clears the selection
function selectPark(id) {
  const park = parkById[id];
  selectedParkId = id; openKey = `park:${id}`; refreshModels();
  map.flyTo({ center: [park.lon, park.lat], zoom: 10.2, pitch: 68, bearing: (Math.random() * 120) - 60, duration: 3200, essential: true });
  showInfo(park);
}
function reset() {
  closeInfo();
  map.flyTo({ ...HOME, pitch: 48, bearing: -12, duration: 2200 });
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") reset();
  if ((e.key === "m" || e.key === "M") && !e.metaKey && !e.ctrlKey && !e.altKey) musicBtn.click();
});

// ---------- Adventure music ----------
const musicBtn = document.getElementById("music");
if (window.AdventureMusic) {
  const musicPref = () => { try { return localStorage.getItem("parks-music"); } catch { return null; } };
  const setMusicPref = v => { try { localStorage.setItem("parks-music", v); } catch {} };
  AdventureMusic.sfxEnabled = musicPref() !== "off";                // the one Sound button controls the music and the item chimes
  AdventureMusic.onchange = on => { musicBtn.classList.toggle("on", on); musicBtn.setAttribute("aria-pressed", on); };
  musicBtn.addEventListener("click", async () => {
    if (AdventureMusic.playing) { AdventureMusic.stop(); AdventureMusic.sfxEnabled = false; setMusicPref("off"); }
    else { AdventureMusic.sfxEnabled = true; await AdventureMusic.start(); setMusicPref("on"); }
  });
  // browsers only allow sound after a click or key press, so the theme starts on the visitor's first
  // interaction with the page — unless they switched it off before (that choice is remembered)
  const startOnFirstGesture = e => {
    if (e.target.closest && e.target.closest("#music")) return;
    ["pointerup", "keydown", "touchend"].forEach(t => removeEventListener(t, startOnFirstGesture));
    if (musicPref() !== "off") AdventureMusic.start();
  };
  ["pointerup", "keydown", "touchend"].forEach(t => addEventListener(t, startOnFirstGesture));
} else musicBtn.hidden = true;

const REGIONS = {
  us: () => reset(),
  ak: () => map.flyTo({ center: [-151, 62.5], zoom: 4.1, pitch: 50, bearing: 10, duration: 2600 }),
  hi: () => map.flyTo({ center: [-156.3, 20.3], zoom: 7, pitch: 55, bearing: -20, duration: 2600 }),
};
document.querySelectorAll(".regions button[data-r]").forEach(b => b.addEventListener("click", () => REGIONS[b.dataset.r]()));
document.getElementById("t3d").addEventListener("click", function () {
  const on = this.classList.toggle("on");
  map.setTerrain(on ? { source: "dem", exaggeration: 1.6 } : null);
  modelsOn = on;
  map.setLayoutProperty("pickups-3d", "visibility", on ? "visible" : "none");
  map.easeTo({ pitch: on ? 55 : 0, duration: 1000 });
});

// ---------- Info popup: name, place and the dates I was there ----------
// closeOnClick is off: the map's click handler opens/closes it itself, so a click on another model never closes it by accident
const infoPopup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, anchor: "left", offset: [70, 0], maxWidth: "360px", className: "info" });
infoPopup.on("close", () => { if (!reopening) { selectedParkId = null; openKey = null; refreshModels(); } });
function showInfo(park) {
  const rows = parkVisits(park.id).map(visitRow);
  showPopup([park.lon, park.lat], card("National park", "#ff9a5c", park.name, park.state, rows.length ? rows : [visitRow({})]));
}
</script>
</body>
</html>
